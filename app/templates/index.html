{% extends "base.html" %}

{% block nav %}
<a href="{{ url_for('main.stories') }}">View My Stories</a>
<a href="{{ url_for('main.expand') }}">Expand a Story</a>
{% endblock %}

{% block content %}
<form method="post">
    <label for="age">Age Group:</label>
    <input type="number" name="age" id="age" min="1" max="120" required value="{{ age or '' }}">
    <label for="ideas">Story Ideas:</label>
    <textarea name="ideas" id="ideas" rows="4" maxlength="1000" required>{{ ideas or '' }}</textarea>
    <input type="submit" value="Generate Story">
</form>
{% endblock %}
